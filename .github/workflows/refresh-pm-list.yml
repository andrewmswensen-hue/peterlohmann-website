name: Refresh Largest PM list

# Rebuilds largest-pm-companies.html from live JotForm submissions.
# Runs automatically once a day, and can be triggered by hand from the
# Actions tab (the "Run workflow" button).

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = ~6am US Eastern
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write           # lets the job commit the refreshed page

# If two runs overlap, let the newer one win instead of racing.
concurrency:
  group: refresh-pm-list
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the list from JotForm
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
        run: python3 build-largest-list.py

      - name: Commit and push if the page changed
        run: |
          git config user.name  "PM List Bot"
          git config user.email "actions@users.noreply.github.com"
          git add largest-pm-companies.html data/company-websites.csv
          if git diff --cached --quiet; then
            echo "No changes today — nothing to commit."
          else
            git commit -m "Auto-refresh Largest PM list from JotForm (+ any newly discovered websites)"
            git push
          fi
